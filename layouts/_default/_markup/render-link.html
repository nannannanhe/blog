{{- $isExternal := and (not (hasPrefix .Destination "/")) (not (hasPrefix .Destination "#")) (not (hasPrefix
.Destination ".")) -}}
<a href="{{ .Destination | safeURL }}" {{- with .Title }} title="{{ . }}" {{ end -}} {{- if $isExternal }}
  target="_blank" rel="noopener noreferrer" {{ end -}}>{{ .Text | safeHTML }}</a>
